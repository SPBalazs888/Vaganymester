name: WPF build
on:
  pull_request:
  push:
    branches: [master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF application
        run: dotnet build Vaganymester/Vaganymester.csproj --configuration Release --nologo
